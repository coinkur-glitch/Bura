<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kripto Sinyal Botu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; color: #58a6ff !important; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
    .card-header { background: #21262d; border-bottom: 1px solid #30363d; border-radius: 12px 12px 0 0 !important; }
    .price-card { transition: transform .15s; }
    .price-card:hover { transform: translateY(-2px); }
    .badge-buy  { background: #1a7f4a; }
    .badge-sell { background: #8b1a1a; }
    .badge-alert{ background: #7f5a1a; }
    .signal-row { border-left: 3px solid transparent; }
    .signal-row.BUY   { border-color: #2ea043; }
    .signal-row.SELL  { border-color: #f85149; }
    .signal-row.ALERT { border-color: #d29922; }
    .scanner-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-on  { background: #2ea043; animation: pulse 1.5s infinite; }
    .dot-off { background: #6e7681; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .change-pos { color: #2ea043; }
    .change-neg { color: #f85149; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-size:.85rem; }
    .form-control, .form-select { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; }
    .form-control:focus, .form-select:focus { background: #0d1117; border-color: #58a6ff; color: #e6edf3; box-shadow: none; }
    .btn-primary { background: #1f6feb; border-color: #1f6feb; }
    .btn-success { background: #238636; border-color: #238636; }
    .btn-danger  { background: #da3633; border-color: #da3633; }
    textarea { resize: vertical; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-graph-up-arrow me-2"></i>Kripto Sinyal</a>
    <div class="d-flex gap-3">
      <a href="/" class="nav-link text-secondary {% if request.path == '/' %}text-white fw-bold{% endif %}">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a href="/settings" class="nav-link text-secondary {% if request.path == '/settings' %}text-white fw-bold{% endif %}">
        <i class="bi bi-gear"></i> Ayarlar
      </a>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
